[package]
name = "local-git-issues"
version = "0.1.0"
description = "Local Git issues"
authors = ["AnimGraphLab Games"]
edition = "2021"

[lib]
name = "local_git_issues_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
